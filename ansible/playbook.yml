---
- name: Deploy Flask App
  hosts: all
  become: true
  vars_files:
    - vars.yml
  
  tasks:
    - name: Install Docker
      apt:
        name: docker.io
        state: present
        update_cache: yes

    - name: Enable Docker
      systemd:
        name: docker
        enabled: yes
        state: started
    
    - name: Install Docker Compose
      get_url:
        url: https://github.com/docker/compose/releases/download/v2.23.3/docker-compose-linux-x86_64
        dest: /usr/local/bin/docker-compose
        mode: '0755'
    
    - name: Install NGINX
      apt:
        name: nginx
        state: present
    
    - name: Restart nginx
      service:
        name: nginx
        state: restarted
        
    - name: Check if node is a Swarm manager
      shell: docker info --format '{{{{ .Swarm.ControlAvailable }}}}'
      register: is_manager
      changed_when: false
      failed_when: false


    - name: Initialize Swarm if not already part of one
      shell: docker swarm init
      when: swarm_status.stdout != "active"
      register: init_output
      failed_when: init_output.rc != 0 and '"This node is already part of a swarm."' not in init_output.stderr

    - name: Check if node is a Swarm manager
      shell: docker info --format '{{ .Swarm.ControlAvailable }}'
      register: is_manager
      changed_when: false
      failed_when: false
      
    - name: Pull the latest Docker image
      shell: docker pull {{ docker_image }}
      become: yes

    - name: Update the Docker Swarm service
      shell: docker service update --image {{ docker_image }} yii2_app_service
      become: yes

