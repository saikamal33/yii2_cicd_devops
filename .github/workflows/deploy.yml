name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Log in to DockerHub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

    - name: Build Docker image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/yii2-app:latest .

    - name: Push image to DockerHub
      run: docker push ${{ secrets.DOCKER_USERNAME }}/yii2-app:latest

    - name: Install Ansible
      run: |
        sudo apt update
        sudo apt install -y ansible

    - name: Run Ansible Playbook
      run: |
        echo "${{ secrets.EC2_SSH_KEY }}" > key.pem
        chmod 600 key.pem
        ansible-playbook ansible/playbook.yml -i ansible/inventory \
          --private-key key.pem \
          -u ubuntu \
          --ssh-extra-args="-o StrictHostKeyChecking=no"

    - name: SSH to EC2 and update service
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/yii2-app:latest
          docker service update --image ${{ secrets.DOCKER_USERNAME }}/yii2-app:latest yii2_app_service

